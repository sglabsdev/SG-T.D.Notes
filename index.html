<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>SG T.D. Notes | Smart Trading Notes & Scenario Analysis</title>
    <meta
      name="description"
      content="Organize trading scenarios, maintain structured trading notes, analyze market setups, and improve trading discipline with SG T.D. Notes."
    />
    <meta
      name="keywords"
      content="SG T.D. Notes, trading notes, trading journal, scenario analysis, trading discipline, market analysis, trader notes"
    />
    <meta name="author" content="SG Labs" />
    <meta name="application-name" content="SG T.D. Notes" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL: update if your final domain changes -->
    <link rel="canonical" href="https://sg-t-d-notes.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Performance -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph: Facebook, WhatsApp, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SG T.D. Notes" />
    <meta
      property="og:title"
      content="SG T.D. Notes | Smart Trading Notes"
    />
    <meta
      property="og:description"
      content="Organize trading scenarios, keep structured notes, and build disciplined trading habits with SG T.D. Notes."
    />
    <meta property="og:url" content="https://sg-t-d-notes.vercel.app/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="SG T.D. Notes | Smart Trading Notes"
    />
    <meta
      name="twitter:description"
      content="A structured workspace for trading notes, scenario analysis, and trading discipline."
    />

    <!-- App Entry -->
    <title>SG T.D. Notes | Smart Trading Notes & Scenario Analysis</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
